# --- TERMINAL FIXES FOR NERD FONTS & COLORS ---
# Set default terminal to support 256 colors
set -g default-terminal "tmux-256color"

# Tell tmux that Alacritty supports RGB (True Color)
# This is usually the culprit for broken icons/colors
set -as terminal-features ",alacritty:RGB"

# Enable undercurl and underscore colors (nice for nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# vim mode
setw -g mode-keys vi

# Use 'v' to begin selection (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy to tmux buffer AND system clipboard (requires xclip)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore (optional but recommended)
set -g @continuum-restore 'on'


# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# vim key binds for changing panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Ctrl + hjkl (lowercase)
bind-key -n C-h resize-pane -L 2
bind-key -n C-j resize-pane -D 2
bind-key -n C-k resize-pane -U 2
bind-key -n C-l resize-pane -R 2

set -g allow-passthrough on


# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
