name: BillGuard
root: /mnt/E/codefile/ReactNative/BillGuard
windows:
  - nvim:
      layout: main-pane
      panes:
        - nvim .
  - frontend:
      layout: main-pane
      panes:
        - cd frontend && npx expo start --web
  - backend:
      layout: main-pane
      panes:
        - cd backend && docker compose up -d db redis && source .venv/bin/activate && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
  - backendtests:
      layout: main-pane
      panes:
        - cd backend && source .venv/bin/activate && PYTHONPATH=. pytest tests/ -v
  - celery:
      layout: main-pane
      panes:
        - cd backend && source .venv/bin/activate && celery -A app.workers.celery_app worker --loglevel=info
  - opencode:
      layout: main-pane
      panes:
        - opencode -s ses_1198b93a1ffeaH3ewtz1BG4V3t
